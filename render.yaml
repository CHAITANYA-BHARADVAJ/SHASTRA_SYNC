# ==========================================================================
# Render deployment for Teammate 2 - The AI Brain.
#
# Render's FREE plan only offers Web Services (must listen on a port), so this
# runs as a `web` service. agent.py detects the PORT env var Render provides,
# serves a tiny health endpoint on it, and runs the polling brain in a
# background thread. The decision logic is identical to worker mode.
#
# Render reads this file from the repo ROOT. After connecting the repo, set
# the secret env vars (sync: false) in the service's "Environment" tab.
#
# NOTE: Render free web services sleep after ~15 min of no HTTP traffic. To
# keep the brain polling 24/7, add a free uptime pinger (e.g. UptimeRobot)
# that GETs the service URL every 5 minutes.
# ==========================================================================
services:
  - type: web
    name: shastra-sync-brain
    runtime: python
    plan: free
    rootDir: agent_brain
    buildCommand: pip install -r requirements.txt
    startCommand: python agent.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: API_URL
        value: https://shastra-sync.onrender.com
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b
      - key: POLL_INTERVAL_SECONDS
        value: "2"
      # Secret - do NOT hardcode. Set this in the Render dashboard.
      - key: GROQ_API_KEY
        sync: false
